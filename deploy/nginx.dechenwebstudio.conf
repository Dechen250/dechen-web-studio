# Origin do site da DWS no proxy da borda (80/443).
# Só dechenwebstudio.com.br / www. Não altere os server_name de cliente.
# Certificados self-signed: Cloudflare SSL em Full (não Full Strict).

server {
    listen 80;
    server_name dechenwebstudio.com.br www.dechenwebstudio.com.br;

    client_max_body_size 8m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://172.17.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}

# Origin HTTPS para Cloudflare SSL mode Full (self-signed serve; Full Strict não).
server {
    listen 443 ssl;
    server_name dechenwebstudio.com.br www.dechenwebstudio.com.br;

    ssl_certificate     /etc/nginx/certs/dws.crt;
    ssl_certificate_key /etc/nginx/certs/dws.key;

    client_max_body_size 8m;

    add_header X-DWS-Origin vps always;

    location / {
        proxy_pass http://172.17.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
